name: Build and audit Front Office History

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore historical-data download cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: foh-nfl-data-v5-${{ runner.os }}
      - name: Source URL/coverage contract
        run: python tests/test_source_contract.py
      - name: Unit-test roster ordering five times
        run: python tests/test_roster_order.py
      - name: Unit-test final room refinement
        run: python tests/test_refine_bundle.py
      - name: Build bundled 2010-2026 database
        run: python scripts/build_data.py --years 2010:2026 --espn-free-agents
      - name: Correct roster year mapping for 2010-2025
        run: python scripts/correct_roster_year_mapping.py --file dist/data/offline-data.json --start 2010 --end 2025
      - name: Remove impossible historical cross-team roster duplicates
        run: python scripts/sanitize_roster_membership.py --file dist/data/offline-data.json
      - name: Refine historical tied position rooms from role evidence
        run: python scripts/refine_bundle.py --file dist/data/offline-data.json
      - name: Clear current roster cache before live rebuild
        run: python scripts/clear_live_roster_cache.py
      - name: Rebuild 2026 from current NFL rosters
        run: python scripts/rebuild_2026_current.py --file dist/data/offline-data.json
      - name: Lock current 2026 NFL positions
        run: python scripts/lock_2026_official_positions.py --file dist/data/offline-data.json
      - name: Build current-source consensus report
        run: python scripts/audit_2026_consensus.py --out dist/data/roster-source-health.json
      - name: Current 2026 live NFL roster and position audit
        run: python scripts/audit_2026_live.py --file dist/data/offline-data.json
      - name: League-wide roster membership and year-alignment audit
        run: python scripts/audit_membership.py --file dist/data/offline-data.json
      - name: Exhaustive historical-data audit
        run: python scripts/audit_data.py --years 2010:2026 --passes 5
      - name: Build frozen UI against offline database
        run: python scripts/build_site.py
      - name: Static smoke test
        run: python scripts/smoke_test.py
      - name: Install browser QA harness
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser interaction smoke test
        env:
          FOH_REQUIRE_BROWSER_QA: '1'
        run: python scripts/browser_smoke.py
      - name: Upload publishable site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
