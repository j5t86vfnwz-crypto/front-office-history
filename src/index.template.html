:root{
  --sky:#dceef2;
  --sky2:#eef7f8;
  --ink:#14221d;

  --line:#d7e0dc;
  --green:#103d2d;

}

}

  content:"";position:fixed;inset:0;pointer-events:none;opacity:.34;
  background-image:
    linear-gradient(rgba(33,90,72,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(33,90,72,.06) 1px, transparent 1px);

  mask-image:linear-gradient(to bottom,black,transparent 82%);

.topbar{
  min-height:78px;padding:14px 22px;border-bottom:1px solid rgba(79,107,95,.13);
  display:flex;align-items:center;justify-content:space-between;gap:16px;background:rgba(255,255,255,.36)
}
.selector-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.select-wrap{position:relative}
.select-wrap label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:#77867f;margin:0 0 4px 2px;font-weight:800}
select{
  height:38px;border-radius:10px;border:1px solid #cfdad4;background:#fff;color:var(--ink);padding:0 34px 0 11px;font-weight:750;outline:none
}
.top-actions{display:flex;align-items:center;gap:8px}
.integrity{
  display:flex;align-items:center;gap:8px;border:1px solid #cfe2d8;background:#edf7f1;color:#235f43;border-radius:999px;padding:8px 10px;font-size:11px;font-weight:800
}
.dot{width:7px;height:7px;border-radius:50%;background:#21a465;box-shadow:0 0 0 4px rgba(33,164,101,.10)}
.btn{
  border:1px solid #cbd8d1;background:white;color:var(--ink);padding:9px 12px;border-radius:10px;font-size:12px;font-weight:800;transition:.15s ease
}
.btn:hover{transform:translateY(-1px);border-color:#9fb8aa}
.btn.primary{background:var(--green);border-color:var(--green);color:white}
.btn.primary:hover{background:var(--green2)}
.btn.orange{background:var(--orange);border-color:var(--orange);color:white}
.btn.danger{background:#fff4f3;border-color:#efc8c5;color:#9d312e}
.btn.link{border:0;background:transparent;padding:6px 0;color:var(--green3)}
.btn.small{padding:7px 9px;border-radius:9px;font-size:11px}
.content{padding:22px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:#70827a;font-weight:850}
.page-head h1{margin:5px 0 5px;font-size:29px;line-height:1.05;letter-spacing:-.035em;color:#173126}
.page-head p{margin:0;color:var(--muted);max-width:800px;font-size:13px;line-height:1.55}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hero-line{
  display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.75fr);gap:14px;margin-bottom:14px
}
.hero-card{
  background:linear-gradient(135deg,var(--green),#154a36);color:white;border-radius:18px;padding:21px;position:relative;overflow:hidden;min-height:178px
}
.hero-card::after{
  content:"";position:absolute;right:-40px;top:-70px;width:260px;height:260px;border:1px solid rgba(255,255,255,.12);border-radius:50%;box-shadow:0 0 0 38px rgba(255,255,255,.035),0 0 0 78px rgba(255,255,255,.025)
}
.hero-card .eyebrow{color:#a9cebd}
.hero-card h2{font-size:31px;margin:8px 0 7px;letter-spacing:-.04em;position:relative;z-index:1}
.hero-card p{color:#c8ddd2;margin:0;max-width:680px;font-size:13px;line-height:1.52;position:relative;z-index:1}
.hero-metrics{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px;position:relative;z-index:1}
.hero-chip{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.10)}
.hero-chip small{display:block;color:#a9c9bb;font-size:9px;text-transform:uppercase;letter-spacing:.11em}
.hero-chip b{display:block;margin-top:3px;font-size:14px}
.panel{
  background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden
}
.panel-head{padding:14px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}
.panel-head h3{margin:0;font-size:14px;letter-spacing:-.01em}
.panel-head p{margin:3px 0 0;color:var(--muted);font-size:11px}
.panel-body{padding:15px}
.quick-stack{display:grid;gap:10px}
.quick-action{
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff
}
.quick-action strong{font-size:13px;display:block}
.quick-action small{color:var(--muted);display:block;margin-top:3px;line-height:1.35}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 7px;border-radius:7px;font-size:9px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.badge.fact{background:#e4f3ea;color:#16633f}
.badge.derived{background:#e8eef8;color:#395a8e}
.badge.model{background:#fff1cd;color:#815c06}
.badge.future{background:#f0ebff;color:#6849a5}
.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:15px}
.kpi .label{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#7b8982;font-weight:850}
.kpi .value{font-size:25px;letter-spacing:-.04em;font-weight:900;margin-top:6px;color:#17372a}
.kpi .sub{font-size:10px;color:#75837c;margin-top:5px;line-height:1.3}
.two-col{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(290px,.75fr);gap:14px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#728078;font-weight:850;background:#f4f7f5;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid #e3eae6;vertical-align:middle}
tr:last-child td{border-bottom:0}
.player-cell{display:flex;align-items:center;gap:9px}
.initial{width:29px;height:29px;border-radius:9px;background:#e7efeb;display:grid;place-items:center;font-size:10px;font-weight:900;color:#28503c}
.player-cell strong{font-size:12px;display:block}
.player-cell small{font-size:10px;color:#78847e;display:block;margin-top:1px}
.pos{font-weight:900;color:#244d39}
.muted{color:var(--muted)}
.search-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.search{
  height:37px;min-width:230px;border-radius:10px;border:1px solid #cfdbd5;background:white;padding:0 11px;outline:none
}
.segment{display:flex;gap:4px;padding:4px;background:#edf2ef;border-radius:10px}
.segment button{border:0;background:transparent;color:#66766e;border-radius:7px;padding:7px 9px;font-size:10px;font-weight:800}
.segment button.active{background:white;color:#204b37;box-shadow:0 2px 8px rgba(32,67,52,.08)}
.group-title{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;background:#edf4f0;border-bottom:1px solid var(--line)}
.group-title strong{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#416052}
.group-title span{font-size:10px;color:#7c8a83}
.notice{padding:12px 13px;border-radius:12px;border:1px solid #e5d6aa;background:#fff9e9;color:#775812;font-size:11px;line-height:1.48}
.truth-note{padding:11px 12px;border-radius:12px;background:#edf6f1;border:1px solid #cfe4d8;color:#2a6145;font-size:11px;line-height:1.48}
.cap-bar{height:14px;border-radius:999px;background:#e5ece8;overflow:hidden;display:flex}
.cap-used{background:var(--green)}
.cap-open{background:#7bc49d}
.cap-labels{display:flex;justify-content:space-between;gap:10px;margin-top:7px;font-size:10px;color:#74827b}
.cap-row{display:flex;justify-content:space-between;gap:18px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}
.cap-row:last-child{border-bottom:0}
.cap-row span{color:var(--muted)}
.asset-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.asset-bank{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.asset-bank h4{margin:0;padding:12px 13px;background:#f3f6f4;border-bottom:1px solid var(--line);font-size:12px}
.asset-list{max-height:430px;overflow:auto}
.asset-row{padding:10px 12px;border-bottom:1px solid #e5ebe8;display:flex;align-items:center;justify-content:space-between;gap:10px}
.asset-row:last-child{border-bottom:0}
.asset-row strong{font-size:11px;display:block}
.asset-row small{font-size:9px;color:#7a8780;display:block;margin-top:2px;line-height:1.25}
.trade-builder{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trade-side{min-height:150px;background:#f5f8f6;border:1px dashed #c7d3cd;border-radius:12px;padding:9px}
.trade-side h5{margin:0 0 8px;font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#687a71}
.trade-item{background:#fff;border:1px solid #dbe3df;border-radius:10px;padding:9px;margin:6px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.trade-item strong{font-size:10px;display:block}
.trade-item small{font-size:9px;color:#7a8780;display:block;margin-top:2px}
.verdict{margin-top:10px;border-radius:13px;padding:12px;border:1px solid var(--line);background:#fff}
.verdict.good{border-color:#b9dec9;background:#f1faf5}
.verdict.warn{border-color:#e6d39e;background:#fffaf0}
.verdict.bad{border-color:#e9c3c0;background:#fff5f4}
.verdict strong{font-size:12px;display:block}
.verdict p{margin:4px 0 0;font-size:10px;color:#68776f;line-height:1.42}
.value-meter{height:7px;border-radius:99px;background:#e5ebe8;overflow:hidden;margin-top:8px}
.value-meter div{height:100%;background:linear-gradient(90deg,#c34f4a,#d6a239 45%,#2d8a5a)}
.pick-strip{display:flex;flex-wrap:wrap;gap:6px}
.pick-pill{border:1px solid #d5dfda;background:white;border-radius:9px;padding:7px 8px;font-size:10px;font-weight:850;color:#214b37}
.pick-pill.live{background:var(--green);color:white;border-color:var(--green)}
.draft-shell{display:grid;grid-template-columns:275px minmax(0,1fr) 300px;gap:12px}
.draft-clock{background:var(--green);color:white;border-radius:16px;padding:17px;min-height:178px;position:sticky;top:94px;height:max-content}
.draft-clock .eyebrow{color:#a7cbb9}
.draft-clock .picknum{font-size:54px;letter-spacing:-.07em;font-weight:1000;margin:6px 0 2px}
.draft-clock p{color:#c2d7cd;font-size:10px;line-height:1.43}
.board-list{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:white}
.prospect{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 11px;border-bottom:1px solid #e3eae6}
.prospect:last-child{border-bottom:0}
.prospect .rank{font-size:16px;font-weight:1000;color:#22543d}
.prospect strong{font-size:11px;display:block}
.prospect small{font-size:9px;color:#77847d;display:block;margin-top:2px}
.ticker{border:1px solid var(--line);border-radius:14px;background:white;overflow:hidden;position:sticky;top:94px;height:max-content}
.ticker-head{padding:11px 12px;background:#f3f6f4;border-bottom:1px solid var(--line);font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.09em}
.ticker-row{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:9px 11px;border-bottom:1px solid #e6ece9}
.ticker-row:last-child{border-bottom:0}
.ticker-row b{font-size:10px}
.ticker-row small{display:block;color:#7b8781;font-size:9px;margin-top:2px}
.fa-card{border:1px solid var(--line);border-radius:14px;background:white;padding:13px}
.fa-card h4{margin:0;font-size:13px}
.fa-card .fa-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.fa-card p{font-size:10px;color:#6e7c75;line-height:1.45;margin:8px 0}
.offer-row{display:flex;gap:7px;align-items:center}
.offer-row input{height:35px;min-width:0;width:110px;border:1px solid #cfdbd5;border-radius:9px;padding:0 9px}
.timeline{position:relative;padding-left:18px}
.timeline::before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:2px;background:#d9e4de}
.event{position:relative;padding:0 0 14px 9px}
.event::before{content:"";position:absolute;left:-18px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--green3);box-shadow:0 0 0 4px #e7f1ec}
.event strong{font-size:11px;display:block}
.event small{font-size:9px;color:#7c8982;display:block;margin-top:3px;line-height:1.4}
.source-card{padding:13px;border-bottom:1px solid var(--line)}
.source-card:last-child{border-bottom:0}
.source-card strong{font-size:11px;display:block}
.source-card p{font-size:10px;color:#6f7e76;line-height:1.45;margin:5px 0}
.source-card a{font-size:10px;color:#176645;font-weight:800;text-decoration:none}
.locked{
  min-height:540px;display:grid;place-items:center;text-align:center;padding:50px 20px
}
.lock-box{max-width:650px}
.lock-icon{width:56px;height:56px;border-radius:18px;background:#e7f1ec;color:var(--green);display:grid;place-items:center;margin:0 auto 14px;font-size:24px}
.lock-box h2{margin:0;font-size:27px;letter-spacing:-.035em;color:#173126}
.lock-box p{color:#68776f;line-height:1.6;font-size:13px}
.toast{
  position:fixed;right:24px;bottom:24px;z-index:50;background:#173d2e;color:white;padding:12px 14px;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.22);
  max-width:360px;font-size:11px;line-height:1.45;opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s ease
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.error{background:#7f2f2b}
.mobile-nav{display:none}
@media(max-width:1180px){
  .app{grid-template-columns:82px minmax(0,1fr)}
  .brand div:last-child,.scenario-mini,.nav button span:not(.ico),.sidebar-foot{display:none}
  .brand{justify-content:center;padding-left:0;padding-right:0}.nav button{justify-content:center;padding:12px}.nav .ico{font-size:16px}
  .hero-line,.two-col,.draft-shell{grid-template-columns:1fr}.draft-clock,.ticker{position:relative;top:auto}.summary-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:760px){
  .app{width:100%;margin:0;border-radius:0;min-height:100vh;grid-template-columns:1fr}
  .sidebar{display:none}.mobile-nav{display:flex;overflow:auto;padding:8px 12px;border-bottom:1px solid var(--line);background:#fff;gap:6px}
  .mobile-nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;font-size:10px}.mobile-nav button.active{background:var(--green);color:white;border-color:var(--green)}
  .topbar{align-items:flex-start;flex-direction:column;padding:12px}.content{padding:14px}.summary-grid,.three-col,.asset-grid,.trade-builder{grid-template-columns:1fr}.hero-line{grid-template-columns:1fr}.top-actions{width:100%;justify-content:space-between}.integrity{font-size:9px}.page-head{flex-direction:column}.page-actions{justify-content:flex-start}.search{min-width:0;width:100%}
}

:root{
  --sky:#dceef2;
  --sky2:#eef7f8;
  --ink:#14221d;
  --muted:#66756e;
  --line:#d7e0dc;
  --green:#103d2d;
  --green2:#164d38;
  --green3:#1d6247;
  --softgreen:#e7f2ec;
  --paper:#fbfdfb;
  --paper2:#f4f8f5;
  --orange:#ff6b2c;
  --good:#16754b;
  --warn:#9a6a08;
  --bad:#ad3a35;
  --shadow:0 22px 70px rgba(26,56,49,.14);
  --radius:20px;
  --radius-sm:13px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  color:var(--ink);
  background:
    radial-gradient(circle at 18% 5%, rgba(255,255,255,.9), transparent 30%),
    radial-gradient(circle at 82% 0%, rgba(255,255,255,.65), transparent 27%),
    linear-gradient(145deg,var(--sky2),var(--sky));
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.34;
  background-image:
    linear-gradient(rgba(33,90,72,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(33,90,72,.06) 1px, transparent 1px);
  background-size:34px 34px;
  mask-image:linear-gradient(to bottom,black,transparent 82%);
}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.46}
.app{
  width:min(1580px,calc(100% - 28px));
  min-height:calc(100vh - 28px);
  margin:14px auto;
  background:rgba(255,255,255,.48);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,.84);
  border-radius:28px;
  box-shadow:var(--shadow);
  overflow:hidden;
  display:grid;
  grid-template-columns:248px minmax(0,1fr);
  position:relative;
}
.sidebar{
  background:linear-gradient(180deg,#0e392a,#113f2e 58%,#0b3024);
  color:#f3fbf6;
  padding:20px 14px;
  display:flex;
  flex-direction:column;
  min-height:calc(100vh - 28px);
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px}
.mark{
  width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
  background:#fff;color:var(--green);font-weight:1000;letter-spacing:-.06em;box-shadow:0 10px 22px rgba(0,0,0,.18)
}
.brand strong{font-size:14px;letter-spacing:.10em;text-transform:uppercase;display:block}
.brand small{display:block;margin-top:3px;color:#a8c7b8;font-size:11px}
.scenario-mini{
  margin:0 6px 14px;padding:13px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09)
}
.scenario-mini .eyebrow{color:#9fc8b4}
.scenario-mini b{display:block;margin-top:5px;font-size:15px}
.scenario-mini small{display:block;margin-top:5px;color:#a9c1b6;line-height:1.35}
.nav{display:grid;gap:5px}
.nav button{
  border:0;background:transparent;color:#bcd2c6;border-radius:12px;padding:11px 12px;
  display:flex;align-items:center;gap:10px;text-align:left;font-weight:650;font-size:13px
}
.nav button:hover{background:rgba(255,255,255,.07);color:white}
.nav button.active{background:white;color:var(--green);box-shadow:0 8px 20px rgba(0,0,0,.14)}
.nav .ico{width:22px;text-align:center;font-size:14px;font-weight:900}
.sidebar-foot{margin-top:auto;padding:14px 8px 2px;color:#9eb9ac;font-size:11px;line-height:1.45}
.workspace{min-width:0;display:flex;flex-direction:column}
.topbar{
  min-height:78px;padding:14px 22px;border-bottom:1px solid rgba(79,107,95,.13);
  display:flex;align-items:center;justify-content:space-between;gap:16px;background:rgba(255,255,255,.36)
}
.selector-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.select-wrap{position:relative}
.select-wrap label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:#77867f;margin:0 0 4px 2px;font-weight:800}
select{
  height:38px;border-radius:10px;border:1px solid #cfdad4;background:#fff;color:var(--ink);padding:0 34px 0 11px;font-weight:750;outline:none
}
.top-actions{display:flex;align-items:center;gap:8px}
.integrity{
  display:flex;align-items:center;gap:8px;border:1px solid #cfe2d8;background:#edf7f1;color:#235f43;border-radius:999px;padding:8px 10px;font-size:11px;font-weight:800
}
.dot{width:7px;height:7px;border-radius:50%;background:#21a465;box-shadow:0 0 0 4px rgba(33,164,101,.10)}
.btn{
  border:1px solid #cbd8d1;background:white;color:var(--ink);padding:9px 12px;border-radius:10px;font-size:12px;font-weight:800;transition:.15s ease
}
.btn:hover{transform:translateY(-1px);border-color:#9fb8aa}
.btn.primary{background:var(--green);border-color:var(--green);color:white}
.btn.primary:hover{background:var(--green2)}
.btn.orange{background:var(--orange);border-color:var(--orange);color:white}
.btn.danger{background:#fff4f3;border-color:#efc8c5;color:#9d312e}
.btn.link{border:0;background:transparent;padding:6px 0;color:var(--green3)}
.btn.small{padding:7px 9px;border-radius:9px;font-size:11px}
.content{padding:22px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:#70827a;font-weight:850}
.page-head h1{margin:5px 0 5px;font-size:29px;line-height:1.05;letter-spacing:-.035em;color:#173126}
.page-head p{margin:0;color:var(--muted);max-width:800px;font-size:13px;line-height:1.55}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hero-line{
  display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.75fr);gap:14px;margin-bottom:14px
}
.hero-card{
  background:linear-gradient(135deg,var(--green),#154a36);color:white;border-radius:18px;padding:21px;position:relative;overflow:hidden;min-height:178px
}
.hero-card::after{
  content:"";position:absolute;right:-40px;top:-70px;width:260px;height:260px;border:1px solid rgba(255,255,255,.12);border-radius:50%;box-shadow:0 0 0 38px rgba(255,255,255,.035),0 0 0 78px rgba(255,255,255,.025)
}
.hero-card .eyebrow{color:#a9cebd}
.hero-card h2{font-size:31px;margin:8px 0 7px;letter-spacing:-.04em;position:relative;z-index:1}
.hero-card p{color:#c8ddd2;margin:0;max-width:680px;font-size:13px;line-height:1.52;position:relative;z-index:1}
.hero-metrics{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px;position:relative;z-index:1}
.hero-chip{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.10)}
.hero-chip small{display:block;color:#a9c9bb;font-size:9px;text-transform:uppercase;letter-spacing:.11em}
.hero-chip b{display:block;margin-top:3px;font-size:14px}
.panel{
  background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden
}
.panel-head{padding:14px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}
.panel-head h3{margin:0;font-size:14px;letter-spacing:-.01em}
.panel-head p{margin:3px 0 0;color:var(--muted);font-size:11px}
.panel-body{padding:15px}
.quick-stack{display:grid;gap:10px}
.quick-action{
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff
}
.quick-action strong{font-size:13px;display:block}
.quick-action small{color:var(--muted);display:block;margin-top:3px;line-height:1.35}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 7px;border-radius:7px;font-size:9px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.badge.fact{background:#e4f3ea;color:#16633f}
.badge.derived{background:#e8eef8;color:#395a8e}
.badge.model{background:#fff1cd;color:#815c06}
.badge.future{background:#f0ebff;color:#6849a5}
.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:15px}
.kpi .label{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#7b8982;font-weight:850}
.kpi .value{font-size:25px;letter-spacing:-.04em;font-weight:900;margin-top:6px;color:#17372a}
.kpi .sub{font-size:10px;color:#75837c;margin-top:5px;line-height:1.3}
.two-col{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(290px,.75fr);gap:14px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#728078;font-weight:850;background:#f4f7f5;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid #e3eae6;vertical-align:middle}
tr:last-child td{border-bottom:0}
.player-cell{display:flex;align-items:center;gap:9px}
.initial{width:29px;height:29px;border-radius:9px;background:#e7efeb;display:grid;place-items:center;font-size:10px;font-weight:900;color:#28503c}
.player-cell strong{font-size:12px;display:block}
.player-cell small{font-size:10px;color:#78847e;display:block;margin-top:1px}
.pos{font-weight:900;color:#244d39}
.muted{color:var(--muted)}
.search-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.search{
  height:37px;min-width:230px;border-radius:10px;border:1px solid #cfdbd5;background:white;padding:0 11px;outline:none
}
.segment{display:flex;gap:4px;padding:4px;background:#edf2ef;border-radius:10px}
.segment button{border:0;background:transparent;color:#66766e;border-radius:7px;padding:7px 9px;font-size:10px;font-weight:800}
.segment button.active{background:white;color:#204b37;box-shadow:0 2px 8px rgba(32,67,52,.08)}
.group-title{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;background:#edf4f0;border-bottom:1px solid var(--line)}
.group-title strong{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#416052}
.group-title span{font-size:10px;color:#7c8a83}
.notice{padding:12px 13px;border-radius:12px;border:1px solid #e5d6aa;background:#fff9e9;color:#775812;font-size:11px;line-height:1.48}
.truth-note{padding:11px 12px;border-radius:12px;background:#edf6f1;border:1px solid #cfe4d8;color:#2a6145;font-size:11px;line-height:1.48}
.cap-bar{height:14px;border-radius:999px;background:#e5ece8;overflow:hidden;display:flex}
.cap-used{background:var(--green)}
.cap-open{background:#7bc49d}
.cap-labels{display:flex;justify-content:space-between;gap:10px;margin-top:7px;font-size:10px;color:#74827b}
.cap-row{display:flex;justify-content:space-between;gap:18px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}
.cap-row:last-child{border-bottom:0}
.cap-row span{color:var(--muted)}
.asset-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.asset-bank{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.asset-bank h4{margin:0;padding:12px 13px;background:#f3f6f4;border-bottom:1px solid var(--line);font-size:12px}
.asset-list{max-height:430px;overflow:auto}
.asset-row{padding:10px 12px;border-bottom:1px solid #e5ebe8;display:flex;align-items:center;justify-content:space-between;gap:10px}
.asset-row:last-child{border-bottom:0}
.asset-row strong{font-size:11px;display:block}
.asset-row small{font-size:9px;color:#7a8780;display:block;margin-top:2px;line-height:1.25}
.trade-builder{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trade-side{min-height:150px;background:#f5f8f6;border:1px dashed #c7d3cd;border-radius:12px;padding:9px}
.trade-side h5{margin:0 0 8px;font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#687a71}
.trade-item{background:#fff;border:1px solid #dbe3df;border-radius:10px;padding:9px;margin:6px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.trade-item strong{font-size:10px;display:block}
.trade-item small{font-size:9px;color:#7a8780;display:block;margin-top:2px}
.verdict{margin-top:10px;border-radius:13px;padding:12px;border:1px solid var(--line);background:#fff}
.verdict.good{border-color:#b9dec9;background:#f1faf5}
.verdict.warn{border-color:#e6d39e;background:#fffaf0}
.verdict.bad{border-color:#e9c3c0;background:#fff5f4}
.verdict strong{font-size:12px;display:block}
.verdict p{margin:4px 0 0;font-size:10px;color:#68776f;line-height:1.42}
.value-meter{height:7px;border-radius:99px;background:#e5ebe8;overflow:hidden;margin-top:8px}
.value-meter div{height:100%;background:linear-gradient(90deg,#c34f4a,#d6a239 45%,#2d8a5a)}
.pick-strip{display:flex;flex-wrap:wrap;gap:6px}
.pick-pill{border:1px solid #d5dfda;background:white;border-radius:9px;padding:7px 8px;font-size:10px;font-weight:850;color:#214b37}
.pick-pill.live{background:var(--green);color:white;border-color:var(--green)}
.draft-shell{display:grid;grid-template-columns:275px minmax(0,1fr) 300px;gap:12px}
.draft-clock{background:var(--green);color:white;border-radius:16px;padding:17px;min-height:178px;position:sticky;top:94px;height:max-content}
.draft-clock .eyebrow{color:#a7cbb9}
.draft-clock .picknum{font-size:54px;letter-spacing:-.07em;font-weight:1000;margin:6px 0 2px}
.draft-clock p{color:#c2d7cd;font-size:10px;line-height:1.43}
.board-list{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:white}
.prospect{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 11px;border-bottom:1px solid #e3eae6}
.prospect:last-child{border-bottom:0}
.prospect .rank{font-size:16px;font-weight:1000;color:#22543d}
.prospect strong{font-size:11px;display:block}
.prospect small{font-size:9px;color:#77847d;display:block;margin-top:2px}
.ticker{border:1px solid var(--line);border-radius:14px;background:white;overflow:hidden;position:sticky;top:94px;height:max-content}
.ticker-head{padding:11px 12px;background:#f3f6f4;border-bottom:1px solid var(--line);font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.09em}
.ticker-row{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:9px 11px;border-bottom:1px solid #e6ece9}
.ticker-row:last-child{border-bottom:0}
.ticker-row b{font-size:10px}
.ticker-row small{display:block;color:#7b8781;font-size:9px;margin-top:2px}
.fa-card{border:1px solid var(--line);border-radius:14px;background:white;padding:13px}
.fa-card h4{margin:0;font-size:13px}
.fa-card .fa-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.fa-card p{font-size:10px;color:#6e7c75;line-height:1.45;margin:8px 0}
.offer-row{display:flex;gap:7px;align-items:center}
.offer-row input{height:35px;min-width:0;width:110px;border:1px solid #cfdbd5;border-radius:9px;padding:0 9px}
.timeline{position:relative;padding-left:18px}
.timeline::before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:2px;background:#d9e4de}
.event{position:relative;padding:0 0 14px 9px}
.event::before{content:"";position:absolute;left:-18px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--green3);box-shadow:0 0 0 4px #e7f1ec}
.event strong{font-size:11px;display:block}
.event small{font-size:9px;color:#7c8982;display:block;margin-top:3px;line-height:1.4}
.source-card{padding:13px;border-bottom:1px solid var(--line)}
.source-card:last-child{border-bottom:0}
.source-card strong{font-size:11px;display:block}
.source-card p{font-size:10px;color:#6f7e76;line-height:1.45;margin:5px 0}
.source-card a{font-size:10px;color:#176645;font-weight:800;text-decoration:none}
.locked{
  min-height:540px;display:grid;place-items:center;text-align:center;padding:50px 20px
}
.lock-box{max-width:650px}
.lock-icon{width:56px;height:56px;border-radius:18px;background:#e7f1ec;color:var(--green);display:grid;place-items:center;margin:0 auto 14px;font-size:24px}
.lock-box h2{margin:0;font-size:27px;letter-spacing:-.035em;color:#173126}
.lock-box p{color:#68776f;line-height:1.6;font-size:13px}
.toast{
  position:fixed;right:24px;bottom:24px;z-index:50;background:#173d2e;color:white;padding:12px 14px;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.22);
  max-width:360px;font-size:11px;line-height:1.45;opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s ease
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.error{background:#7f2f2b}
.mobile-nav{display:none}
@media(max-width:1180px){
  .app{grid-template-columns:82px minmax(0,1fr)}
  .brand div:last-child,.scenario-mini,.nav button span:not(.ico),.sidebar-foot{display:none}
  .brand{justify-content:center;padding-left:0;padding-right:0}.nav button{justify-content:center;padding:12px}.nav .ico{font-size:16px}
  .hero-line,.two-col,.draft-shell{grid-template-columns:1fr}.draft-clock,.ticker{position:relative;top:auto}.summary-grid{grid-template-columns:repeat(2,1fr)}
}

  .mobile-nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;font-size:10px}.mobile-nav button.active{background:var(--green);color:white;border-color:var(--green)}
  .topbar{align-items:flex-start;flex-direction:column;padding:12px}.content{padding:14px}.summary-grid,.three-col,.asset-grid,.trade-builder{grid-template-columns:1fr}.hero-line{grid-template-columns:1fr}.top-actions{width:100%;justify-content:space-between}.integrity{font-size:9px}.page-head{flex-direction:column}.page-actions{justify-content:flex-start}.search{min-width:0;width:100%}
}

  --elev:0 10px 30px rgba(31,57,48,.07);

body{letter-spacing:0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

function roster(){

  else if(state.rosterView==='fa')players=players.filter(isPendingFA);

  // during the completed season. Otherwise a real WR1/TE1 can disappear entering
  // the offseason and the historical position room becomes misleading.
  const groups=GROUP_ORDER.map(g=>{
    const all=players.filter(p=>(p._roomGroup||groupForPos(playerPosition(p)))===g).sort(sortWithinPosition);
    const shown=q?all:all.slice(0,5);
    return [g,shown,all.length];
  }).filter(([,ps])=>ps.length);

  return pageHead('Personnel','Roster',`${viewLabel} · ${players.length} players`)+

  `<div class="draft-workspace"><section class="prospect-list"><div class="panel-head"><div><h3>Draft board</h3><p>${isOurs?`Choose at #${current}`:'Trade into the current pick or advance the league clock'}</p></div></div>${available.map(p=>`<div class="prospect"><div class="rank">${p.actual_pick}</div>${photoMarkup(p,'sm',canonicalTeamFromAbbr(p.actual_team))}<div><strong>${playerName(p)}</strong><small>${playerPosition(p)} • ${p.college||'—'} • historical rank #${p.actual_pick}</small></div><button class="btn small ${isOurs?'primary':''}" data-draft="${encodeURIComponent(playerKey(p))}" ${isOurs?'':'disabled'}>Draft</button></div>`).join('')}</section><section class="draft-order"><div class="panel-head"><div><h3>League draft order</h3><p>Trade into any pick that has not passed</p></div></div><div class="draft-order-list">${order.map(({pick,actual})=>{const team=draftOwnerTeam(pick),done=pick<current,ours=state.picks.includes(pick);return `<div class="draft-order-row ${pick===current?'current':''} ${done?'done':''}"><div class="num">#${pick}</div>${teamLogo(team,'sm')}<div><strong>${historicalName(team,state.year)}</strong><small>${done?(state.drafted.find(x=>x.usedPick===pick)||state.cpuDrafted.find(x=>x.selectedAt===pick))?playerName(state.drafted.find(x=>x.usedPick===pick)||state.cpuDrafted.find(x=>x.selectedAt===pick)):'Complete':ours?'Your pick':`Historical: ${playerName(actual)}`}</small></div>${done||ours?`<span class="draft-row-status ${ours&&!done?'live':''}">${ours&&!done?'Yours':'Set'}</span>`:`<button class="btn small" data-trade-draft-pick="${pick}">Trade</button>`}</div>`}).join('')}</div></section></div>`
}
function coaches(){return pageHead('Ownership','Head coach','Alternate timeline control')+`<div class="two-col"><section class="panel"><div class="panel-head"><div><h3>Head coach</h3></div></div><div class="panel-body"><div class="coach-name">${state.coach}</div><div class="coach-actions"><button class="btn danger" id="fireCoach" ${state.coach==='Vacant'?'disabled':''}>Fire coach</button></div></div></section><section class="panel"><div class="panel-head"><div><h3>Hire replacement</h3></div></div><div class="panel-body"><div class="coach-form"><input id="coachName" placeholder="Enter coach name"><button class="btn primary" id="hireCoach" ${state.coach==='Vacant'?'':'disabled'}>Hire</button></div></div></section></div>`}
function timeline(){return pageHead('History','Timeline',`${state.events.length} move${state.events.length===1?'':'s'}`)+`<section class="panel"><div class="panel-body"><div class="timeline">${state.events.length?state.events.map(e=>`<div class="event"><strong>${e.title}</strong><small>${e.detail}</small></div>`).join(''):'<div class="event"><strong>No moves yet</strong><small>Trades, signings, draft picks and coach moves appear here.</small></div>'}</div></div></section>`}
function sources(){return pageHead('Data','Sources','Historical data layer')+`<section class="panel"><div class="source"><strong>NFLverse rosters + players</strong><p>Season rosters plus the master player-ID/headshot file are merged with weekly depth charts.</p><a href="https://nflreadr.nflverse.com/reference/load_rosters.html" target="_blank" rel="noreferrer">Open source</a></div><div class="source"><strong>NFLverse depth charts</strong><p>Depth chart data back to 2001.</p><a href="https://nflreadr.nflverse.com/reference/load_depth_charts.html" target="_blank" rel="noreferrer">Open source</a></div><div class="source"><strong>NFLverse / nfldata draft picks + trades</strong><p>Historical selections and transaction records.</p><a href="https://github.com/nflverse/nfldata" target="_blank" rel="noreferrer">Open source</a></div><div class="source"><strong>ESPN historical free-agent index</strong><p>Season-scoped leaguewide free-agent records are loaded across all pages and merged with NFLverse UFA/RFA/ERFA roster statuses.</p><a href="https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/2024/freeagents" target="_blank" rel="noreferrer">Open source</a></div><div class="source"><strong>NFL Football Operations</strong><p>Official league salary-cap history.</p><a href="https://operations.nfl.com/inside-football-ops/nfl-operations/nfl-salary-cap/" target="_blank" rel="noreferrer">Open source</a></div></section>`}
function render(){buildNav();updateChrome();const root=document.querySelector('#root');if(state.loading){root.innerHTML=loadingPage();return}if(state.error){root.innerHTML=errorPage();return}const pages={overview,roster,cap:capPage,trade,freeagency:freeAgency,draft,coaches,timeline,sources};root.innerHTML=(pages[state.page]||overview)()}
function commit(title,detail,mutate){if(mutate)mutate();state.events.unshift({title,detail,id:Date.now()+Math.random()});render()}
function findRosterByKey(key){return currentRoster().find(p=>playerKey(p)===key||normalizeName(playerName(p))===key)}
function sideValue(side){return side.reduce((sum,a)=>sum+assetValue(a),0)}
function tradeVerdict(){const out=sideValue(state.outgoing),inc=sideValue(state.incoming);if(!out||!inc)return {c:'warn',label:'Incomplete offer',text:'Add assets to both sides.',score:0,ok:false};const ratio=out/inc;const balance=Math.min(out,inc)/Math.max(out,inc);const incomingPlayers=state.incoming.filter(a=>a.kind==='player');const elite=incomingPlayers.some(a=>(a.value||0)>=1250);const premiumQB=incomingPlayers.some(a=>String(a.pos||'').toUpperCase()==='QB'&&(a.value||0)>=1050);const firstsOut=state.outgoing.filter(a=>(a.kind==='pick'&&a.pick<=32)||(a.kind==='future_pick'&&a.round===1)).length;const premiumAssetOut=state.outgoing.some(a=>a.kind==='player'&&(a.value||0)>=900);if((elite||premiumQB)&&!premiumAssetOut&&firstsOut===0)return {c:'bad',label:'Rejected',text:'A premium player requires premium draft capital or a major player in return.',score:Math.round(balance*100),ok:false};if(ratio<.86)return {c:'bad',label:'Rejected',text:'The other team is giving up too much value.',score:Math.round(balance*100),ok:false};if(ratio<.96)return {c:'warn',label:'Counter likely',text:'Close, but the other team would likely ask for another asset.',score:Math.round(balance*100),ok:true};if(ratio<=1.16)return {c:'good',label:'Likely accepted',text:'The package is balanced enough to be realistic.',score:Math.round(balance*100),ok:true};if(ratio<=1.32)return {c:'good',label:'Strong offer',text:'The other team receives a clear value premium.',score:Math.round(balance*100),ok:true};return {c:'warn',label:'Overpay',text:'The deal should be accepted, but you are giving up significantly more value.',score:Math.round(balance*100),ok:true}}
function assetItem(a,i,side){const title=a.kind==='pick'?`${state.year} Pick #${a.pick}`:a.kind==='future_pick'?`${a.year} Round ${a.round}`:a.name;const detail=a.kind==='pick'?`Value ${Math.round(pv(a.pick))}`:a.kind==='future_pick'?`${a.owner?historicalName(a.owner,state.year):''} • value ${assetValue(a)}`:`${a.pos||'—'} • value ${a.value||'—'}`;return `<div class="trade-item"><div><strong>${title}</strong><small>${detail}</small></div><button class="btn text-btn" data-remove-${side}="${i}">Remove</button></div>`}
function submitTrade(){const v=tradeVerdict();if(!v.ok){toast(v.text,true);return}const outText=state.outgoing.map(a=>a.kind==='pick'?`#${a.pick}`:a.kind==='future_pick'?`${a.year} R${a.round}`:a.name).join(', '),inText=state.incoming.map(a=>a.kind==='pick'?`#${a.pick}`:a.kind==='future_pick'?`${a.year} R${a.round}`:a.name).join(', ');const partner=state.tradeTargetTeam;commit(`Trade with ${historicalName(partner,state.year)}`,`Sent ${outText} • received ${inText}`,()=>{for(const a of state.outgoing){if(a.kind==='pick'){state.picks=state.picks.filter(p=>p!==a.pick);state.pickOwners.set(a.pick,normalizeTradeAbbr(draftAliases(partner,state.year)[0]))}else if(a.kind==='future_pick'){if(a.owner===state.team)state.futurePicksTraded.add(futurePickKey(a));else state.acquiredFuturePicks=state.acquiredFuturePicks.filter(x=>futurePickKey(x)!==futurePickKey(a))}else state.departed.add(a.key)}for(const a of state.incoming){if(a.kind==='pick'){if(a.pick>=state.draftCursor&&!state.picks.includes(a.pick))state.picks.push(a.pick);state.pickOwners.set(a.pick,normalizeTradeAbbr(draftAliases(state.team,state.year)[0]))}else if(a.kind==='future_pick'){const acquired={...a,owner:partner,acquiredFrom:partner};if(!state.acquiredFuturePicks.some(x=>futurePickKey(x)===futurePickKey(acquired)))state.acquiredFuturePicks.push(acquired)}else{state.rosterAdds.push(a.player);state.leagueDeparted.add(`${partner}|${a.key}`)}}state.picks.sort((a,b)=>a-b);state.outgoing=[];state.incoming=[]});const nextPage=state.returnAfterTrade||'trade';state.returnAfterTrade='';state.page=nextPage;render();toast('Trade completed and timeline updated.')}
function draftPlayer(key){const pick=state.draftCursor;if(!state.picks.includes(pick)){toast(`You do not own pick #${pick}.`,true);return}const p=availableDraft().find(x=>playerKey(x)===key||normalizeName(playerName(x))===key);if(!p){toast('That player is already off the board.',true);return}commit(`Drafted ${playerName(p)} at #${pick}`,`${playerPosition(p)} • ${p.college||'—'}`,()=>{const picked={...p,usedPick:pick,selectedAt:pick,byUser:true,selectedTeam:state.team,status:'ROOKIE'};state.drafted.push(picked);state.rosterAdds.push(picked);state.picks=state.picks.filter(x=>x!==pick);state.draftCursor=pick+1});toast(`${playerName(p)} selected.`)}
function signFreeAgent(key,button){const p=state.freeAgents.find(x=>playerKey(x)===key||normalizeName(playerName(x))===key);if(!p||state.signed.some(s=>playerKey(s)===playerKey(p)))return;const row=button?.closest?.('[data-fa-row]'),input=row?.querySelector?.('.fa-offer-input');const offerM=Math.max(.5,Number(input?.value)||1),askM=p.modelAsk||freeAgentAsk(p);if(offerM<askM*.88){toast(`${playerName(p)} rejected the offer. A competitive offer is about $${askM.toFixed(1)}M/year.`,true);return}const apy=offerM*1e6;if(availableCapRoom()!=null&&apy>availableCapRoom()){toast('That offer exceeds your estimated remaining cap room.',true);return}commit(`Signed ${playerName(p)}`,`${mm(apy)} per year`,()=>{const signed={...p,status:'SIGNED',modelApy:apy,team:BASE_ABBR[state.team]||p.team};state.signed.push(signed);state.rosterAdds.push(signed)});toast(`${playerName(p)} signed and added to your roster.`)}
function resetMoves(){state.picks=[...(state.basePicks||[])];state.pickOwners=new Map(state.basePickOwners||[]);state.drafted=[];state.cpuDrafted=[];state.draftCursor=1;state.signed=[];state.rosterAdds=[];state.departed=new Set();state.outgoing=[];state.incoming=[];state.futurePicksTraded=new Set();state.acquiredFuturePicks=[];state.leagueDeparted=new Set();state.returnAfterTrade='';state.events=[];state.coach=state.baseCoach;state.page='overview';render();toast('Moves reset.')}
function bind(){
  const loadBtn=document.querySelector('#loadScenarioBtn');if(loadBtn)loadBtn.addEventListener('click',loadScenario);
  document.querySelector('#yearSelect').addEventListener('change',e=>{state.year=Number(e.target.value);refreshTeamLabels();applyTheme(state.team);loadScenario()});
  document.querySelector('#teamSelect').addEventListener('change',e=>{state.team=e.target.value;applyTheme(state.team);loadScenario()});
  document.querySelector('#resetBtn').addEventListener('click',resetMoves);
  document.querySelector('#app').addEventListener('change',e=>{
    if(e.target.id==='tradeTargetSelect'){const team=e.target.value;if(team&&team!==state.team)setTradePartner(team,true)}
    if(e.target.id==='faTeamFilter'){state.faTeamFilter=e.target.value;render()}
    if(e.target.id==='faPosFilter'){state.faPosFilter=e.target.value;render()}
    if(e.target.id==='faTypeFilter'){state.faTypeFilter=e.target.value;render()}
    if(e.target.id==='faSort'){state.faSort=e.target.value;render()}
  });
  document.querySelector('#app').addEventListener('click',e=>{
    const nav=e.target.closest('[data-nav]');if(nav){state.page=nav.dataset.nav;render();const root=document.querySelector('#root');if(root)root.scrollIntoView({block:'start',behavior:'smooth'});if(state.page==='trade'&&!state.tradeTargetRoster.length&&!state.tradeTargetLoading)loadTradeTargetRoster();return}
    if(e.target.closest('#retryLoad')){loadScenario();return}
    const rv=e.target.closest('[data-roster-view]');if(rv){state.rosterView=rv.dataset.rosterView;render();return}
    const quickAdd=e.target.closest('[data-add-player]');if(quickAdd){const key=decodeURIComponent(quickAdd.dataset.addPlayer),p=findRosterByKey(key);if(p&&!state.outgoing.some(a=>a.kind==='player'&&a.key===playerKey(p)))state.outgoing.push({kind:'player',key:playerKey(p),name:playerName(p),pos:playerPosition(p),value:modelValue(p)});state.page='trade';render();if(!state.tradeTargetRoster.length&&!state.tradeTargetLoading)loadTradeTargetRoster();return}
    const outPlayer=e.target.closest('[data-out-player]');if(outPlayer){const key=decodeURIComponent(outPlayer.dataset.outPlayer),p=currentRoster().find(x=>playerKey(x)===key);if(p&&!state.outgoing.some(a=>a.kind==='player'&&a.key===key)){state.outgoing.push({kind:'player',key,name:playerName(p),pos:playerPosition(p),value:modelValue(p)});render();toast(`${playerName(p)} added to your side.`)}return}
    const op=e.target.closest('[data-out-pick]');if(op){const pick=Number(op.dataset.outPick);if(!state.outgoing.some(a=>a.kind==='pick'&&a.pick===pick)){state.outgoing.push({kind:'pick',pick,owner:state.team});render();toast(`Pick #${pick} added to your side.`)}return}
    const of=e.target.closest('[data-out-future-key]');if(of){const [year,round]=String(of.dataset.outFutureKey).split('-').map(Number);const a=ownFutureAssets().find(x=>x.year===year&&x.round===round);if(a&&!state.outgoing.some(x=>x.kind==='future_pick'&&futurePickKey(x)===futurePickKey(a))){state.outgoing.push({...a});render();toast(`${year} Round ${round} added to your side.`)}return}
    const ip=e.target.closest('[data-in-player-key]');if(ip){const key=decodeURIComponent(ip.dataset.inPlayerKey),p=state.tradeTargetRoster.find(x=>playerKey(x)===key);if(p&&!state.incoming.some(a=>a.kind==='player'&&a.key===key)){state.incoming.push({kind:'player',key,name:playerName(p),pos:playerPosition(p),value:modelValue(p),player:{...p,status:'ACQUIRED',team:BASE_ABBR[state.team]||p.team}});render();toast(`${playerName(p)} added to return.`)}return}
    const inp=e.target.closest('[data-in-pick]');if(inp){const pick=Number(inp.dataset.inPick);if(pick>=state.draftCursor&&!state.incoming.some(a=>a.kind==='pick'&&a.pick===pick))state.incoming.push({kind:'pick',pick,owner:state.tradeTargetTeam,value:pv(pick)});render();return}
    const inf=e.target.closest('[data-in-future-key]');if(inf){const [year,round]=String(inf.dataset.inFutureKey).split('-').map(Number);const a=partnerFutureAssets(state.tradeTargetTeam).find(x=>x.year===year&&x.round===round);if(a&&!state.incoming.some(x=>x.kind==='future_pick'&&futurePickKey(x)===futurePickKey(a))){state.incoming.push({...a});render();toast(`${year} Round ${round} added to return.`)}return}
    const ro=e.target.closest('[data-remove-out]');if(ro){state.outgoing.splice(Number(ro.dataset.removeOut),1);render();return}
    const ri=e.target.closest('[data-remove-in]');if(ri){state.incoming.splice(Number(ri.dataset.removeIn),1);render();return}
    if(e.target.closest('#submitTrade')){submitTrade();return}
    if(e.target.closest('#clearTrade')){state.outgoing=[];state.incoming=[];render();return}
    const tradePick=e.target.closest('[data-trade-draft-pick]');if(tradePick){beginPickTrade(Number(tradePick.dataset.tradeDraftPick));return}
    if(e.target.closest('#advanceCpuPick')){advanceCpuPick();return}
    if(e.target.closest('#simToOwnPick')){simToNextOwnPick();return}
    const dr=e.target.closest('[data-draft]');if(dr){draftPlayer(decodeURIComponent(dr.dataset.draft));return}
    const sf=e.target.closest('[data-sign-fa]');if(sf){signFreeAgent(decodeURIComponent(sf.dataset.signFa),sf);return}
    if(e.target.closest('#fireCoach')){if(state.coach!=='Vacant')commit(`Fired ${state.coach}`,'Head coach position opened.',()=>state.coach='Vacant');return}
    if(e.target.closest('#hireCoach')){if(state.coach==='Vacant'){const name=(document.querySelector('#coachName')?.value||'').trim();if(!name){toast('Enter a coach name.',true);return}commit(`Hired ${name}`,'Head coach',()=>state.coach=name)}return}
  });
  document.querySelector('#app').addEventListener('input',e=>{
    if(e.target.id==='rosterSearch'){state.rosterSearch=e.target.value;const pos=e.target.selectionStart;render();setTimeout(()=>{const n=document.querySelector('#rosterSearch');if(n){n.focus();n.setSelectionRange(pos,pos)}},0)}
    if(e.target.id==='faSearch'){state.faSearch=e.target.value;const pos=e.target.selectionStart;render();setTimeout(()=>{const n=document.querySelector('#faSearch');if(n){n.focus();n.setSelectionRange(pos,pos)}},0)}
    if(e.target.id==='tradeTargetSearch'){state.tradeTargetSearch=e.target.value;const pos=e.target.selectionStart;render();setTimeout(()=>{const n=document.querySelector('#tradeTargetSearch');if(n){n.focus();n.setSelectionRange(pos,pos)}},0)}
  });
  document.querySelector('#app').addEventListener('error',e=>{const img=e.target;if(!(img instanceof HTMLImageElement)||!img.closest('.player-photo'))return;const a1=img.dataset.alt1,a2=img.dataset.alt2,fb=img.dataset.fallback;if(a1&&img.src!==a1){img.dataset.alt1='';img.src=a1;return}if(a2&&img.src!==a2){img.dataset.alt2='';img.src=a2;return}if(fb&&img.src!==fb)img.src=fb},true)
}
function init(){buildSelectors();applyTheme(state.team);bind();loadScenario()}
init();
})();
</script>
</body>
